name: 天翼云盘签到

on:
  push:
    branches:
      - main
  watch:
    types: started
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'   # UTC 时间；北京时间 = UTC+8，即每天 10:35

# 新增：给 GITHUB_TOKEN 显式授权（新版仓库默认是只读，会导致 push / 删除运行记录失败）
permissions:
  contents: write   # “Keep Running” 步骤需要提交并 push
  actions: write    # “Delete old workflow run” 步骤需要删除运行记录

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # ⚠️ 若你没在 Settings → Environments 里创建名为 user 的环境，请保持这一行注释，
    #    否则 job 会直接失败："Value 'user' for environment is not valid"。
     environment: user

    steps:
      - name: 🔀 random delay 0-300 seconds
        run: sleep $((RANDOM % 301))

      - name: 🔌 Check out code
        uses: actions/checkout@v4

      - name: 🔨 Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm   # ⚠️ 仓库根目录必须有 package-lock.json，否则此步会报 “lock file not found”

      - name: 👾 Check if Debug is true
        # ⚠️ 需在 Settings → Secrets and variables → Variables 里建一个 debug = 1 的变量才会生效
        if: vars.debug == '1'
        run: |
          echo "CLOUD189_VERBOSE=1" >> $GITHUB_ENV

      - name: 📹 Restore cached Cookie
        id: cache-cookie-restore
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ hashFiles('.token/*.json') }}
          restore-keys: cloud189-token-

      - name: 🔧 Init secrets
        # ⚠️ @master 指向上游分支，不稳定；建议固定到某个 release tag 或 commit SHA
        uses: shine1594/secrets-to-env-action@master
        with:
          secrets: ${{ toJSON(secrets) }}
          secrets_env: production
          prefix_prod: ""
          file_name_prod: .env

      - name: 📡 Init dependencies
        run: npm install

      - name: 🚀 Run
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm start

      - name: 🔑 Compute token hash
        if: always()
        run: |
          NEW_HASH=$(find .token -name '*.json' -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "TOKEN_HASH=${NEW_HASH}" >> $GITHUB_ENV

      - name: 📹 Save cached Cookie
        if: always() && env.TOKEN_HASH != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .token
          key: cloud189-token-${{ env.TOKEN_HASH }}

      - name: 🚗 Keep Running
        if: github.event_name == 'schedule'
        run: |
          git config --local user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git config --local user.name "${{ github.actor }}"
          git remote set-url origin https://${{ github.actor }}:${{ github.token }}@github.com/${{ github.repository }}
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..." || true
          git push

      - name: 🎉 Delete old workflow run
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 50
